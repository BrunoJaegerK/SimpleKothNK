# Duración total del evento KOTH en segundos. El temporizador es global y no se pausa.
capture-time-seconds: 180

# Cuenta regresiva previa al evento.
# Se fuerza un mínimo de 30 segundos aunque se configure un valor menor.
countdown:
  seconds: 30
  # Segundos restantes en los que se enviará un anuncio al chat.
  announcements:
    - 30
    - 20

# Inicio automático. El próximo inicio se guarda como fecha Unix en milisegundos
# dentro de auto-start.next-start-at; no edites ese valor manualmente.
auto-start:
  enabled: true
  # 86400 = 24 horas; 259200 = 3 días.
  interval-seconds: 86400
  next-start-at: 0

# Mundo donde se encuentra la región. Se configura automáticamente con /koth set.
region:
  pos1-world: ""
  pos2-world: ""
  pos1:
    x: 0
    y: 0
    z: 0
  pos2:
    x: 0
    y: 0
    z: 0

# Se ejecutan desde consola cuando alguien gana. Usa {player} como placeholder.
winner-commands:
  - "say {player} ha ganado el KOTH"
