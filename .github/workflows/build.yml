name: Build SimpleKothNK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: simplekothnk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKothNK
          path: target/SimpleKothNK-*.jar
          if-no-files-found: error
